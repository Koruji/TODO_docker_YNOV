spring:
  web:
    locale: fr
    locale-resolver: fixed
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo}
    username: ${DB_USER:todo}
    password: ${DB_PASSWORD:todo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    # Origines autorisées, séparées par des virgules (Vite : 5173)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
